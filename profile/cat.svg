<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 82" width="800" height="82">
  <style>
    .cat { animation: run 7s linear infinite; }
    .la  { animation: show 0.36s infinite; }
    .lb  { animation: hide 0.36s infinite; }
    @keyframes run  { from { transform: translateX(-100px); } to { transform: translateX(810px); } }
    @keyframes show { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }
    @keyframes hide { 0%,50% { opacity:0; } 50.01%,100% { opacity:1; } }
  </style>
  <g class="cat">

    <!-- Хвост (слева, вьётся вверх) -->
    <rect x="2"  y="20" width="12" height="12" fill="#3A1800"/>
    <rect x="4"  y="22" width="8"  height="10" fill="#F5C77E"/>
    <rect x="0"  y="10" width="12" height="12" fill="#3A1800"/>
    <rect x="2"  y="12" width="8"  height="10" fill="#F5C77E"/>
    <rect x="4"  y="4"  width="10" height="8"  fill="#3A1800"/>
    <rect x="6"  y="6"  width="6"  height="6"  fill="#F5C77E"/>

    <!-- Тело -->
    <rect x="6"  y="30" width="52" height="26" fill="#3A1800"/>
    <rect x="8"  y="32" width="48" height="22" fill="#F5C77E"/>
    <!-- Полоски тигрового окраса -->
    <rect x="14" y="34" width="4"  height="16" fill="#D4952A"/>
    <rect x="36" y="34" width="4"  height="16" fill="#D4952A"/>

    <!-- Левое ухо -->
    <rect x="48" y="8"  width="12" height="16" fill="#3A1800"/>
    <rect x="50" y="10" width="8"  height="13" fill="#F5C77E"/>
    <rect x="51" y="11" width="5"  height="10" fill="#FF9999"/>

    <!-- Правое ухо -->
    <rect x="62" y="8"  width="12" height="16" fill="#3A1800"/>
    <rect x="64" y="10" width="8"  height="13" fill="#F5C77E"/>
    <rect x="65" y="11" width="5"  height="10" fill="#FF9999"/>

    <!-- Голова -->
    <rect x="48" y="14" width="30" height="28" fill="#3A1800"/>
    <rect x="50" y="16" width="26" height="24" fill="#F5C77E"/>

    <!-- Глаз -->
    <rect x="64" y="20" width="10" height="8"  fill="#FFFDE7"/>
    <rect x="65" y="21" width="6"  height="6"  fill="#2C1400"/>
    <rect x="65" y="21" width="2"  height="2"  fill="#FFFDE7"/>

    <!-- Нос -->
    <rect x="74" y="30" width="6"  height="5"  fill="#FF9999"/>

    <!-- Усы -->
    <line x1="74" y1="29" x2="92" y2="25" stroke="#C8A870" stroke-width="1.5"/>
    <line x1="74" y1="33" x2="92" y2="33" stroke="#C8A870" stroke-width="1.5"/>
    <line x1="74" y1="36" x2="92" y2="40" stroke="#C8A870" stroke-width="1.5"/>

    <!-- Лапы: кадр A (передняя вперёд, задняя назад) -->
    <g class="la">
      <!-- Передняя лапа -->
      <rect x="50" y="52" width="10" height="24" fill="#3A1800"/>
      <rect x="52" y="54" width="6"  height="22" fill="#F5C77E"/>
      <rect x="49" y="72" width="13" height="5"  fill="#F5C77E"/>
      <!-- Задняя лапа -->
      <rect x="10" y="52" width="10" height="24" fill="#3A1800"/>
      <rect x="12" y="54" width="6"  height="22" fill="#F5C77E"/>
      <rect x="9"  y="72" width="13" height="5"  fill="#F5C77E"/>
    </g>

    <!-- Лапы: кадр B (передняя назад, задняя вперёд) -->
    <g class="lb">
      <!-- Передняя лапа -->
      <rect x="38" y="52" width="10" height="24" fill="#3A1800"/>
      <rect x="40" y="54" width="6"  height="22" fill="#F5C77E"/>
      <rect x="37" y="72" width="13" height="5"  fill="#F5C77E"/>
      <!-- Задняя лапа -->
      <rect x="24" y="52" width="10" height="24" fill="#3A1800"/>
      <rect x="26" y="54" width="6"  height="22" fill="#F5C77E"/>
      <rect x="23" y="72" width="13" height="5"  fill="#F5C77E"/>
    </g>

  </g>
</svg>
